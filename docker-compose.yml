services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    volumes:
      - uploads_data:/data/uploads
      - output_data:/data/output
    healthcheck:
      # stdlib only: httpx is not installed in the backend image, and adding it
      # just for a healthcheck would put a dependency in the production image.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - vehicular-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vehicular-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  uploads_data:
  output_data:

networks:
  vehicular-network:
    driver: bridge
