services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-vehicular_inspections}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vehicular_inspections}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vehicular-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vehicular-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-vehicular_inspections}
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
      - output_data:/data/output
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vehicular-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vehicular-network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      BOT_API_BASE_URL: http://backend:8000/api
      BOT_API_KEY: ${BOT_API_KEY:-}
      BOT_LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
      BOT_POLLING_INTERVAL_SECONDS: ${BOT_POLLING_INTERVAL_SECONDS:-30}
      BOT_REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - vehicular-network

volumes:
  pg_data:
  uploads_data:
  output_data:

networks:
  vehicular-network:
    driver: bridge
